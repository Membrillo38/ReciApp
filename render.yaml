services:
  - type: web
    name: reciapp-4ih5
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_EXPECTED_HOST
        sync: false
      - key: SUPABASE_TIMEOUT_SECONDS
        value: "10"
      - key: READINESS_TIMEOUT_SECONDS
        value: "3"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_DURATION_SECONDS
        value: "600"
      - key: RECIPE_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: SUPERWALL_WEBHOOK_SECRET
        sync: false
      - key: SUPERWALL_APPLICATION_ID
        value: "54783"
      - key: APPLE_ROOT_CA_PEM
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.membri.reciapp
      - key: APPLE_ENVIRONMENT
        value: Production
      - key: PUBLIC_API_BASE_URL
        value: https://reciapp-4ih5.onrender.com
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
      - key: DASHBOARD_TOTP_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://reciapp-4ih5.onrender.com
      - key: BILLING_GUARD_ENABLED
        value: "true"
      - key: DAILY_API_BUDGET_CENTS
        value: "1000"
      - key: MONTHLY_API_BUDGET_CENTS
        value: "5000"
      - key: USER_MONTHLY_BUDGET_CENTS
        value: "500"
      - key: MAX_JOB_COST_CENTS
        value: "100"
      - key: MAX_CONCURRENT_JOBS
        value: "8"
      - key: MAX_CONCURRENT_JOBS_PER_USER
        value: "2"
      - key: WORKER_ENABLED
        value: "false"
      - key: WORKER_LEASE_SECONDS
        value: "900"
