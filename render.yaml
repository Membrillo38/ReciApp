services:
  - type: web
    name: reciapp-4ih5
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_DURATION_SECONDS
        value: "600"
      - key: RECIPE_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: SUPERWALL_WEBHOOK_SECRET
        sync: false
      - key: SUPERWALL_APPLICATION_ID
        value: "54783"
      - key: PUBLIC_API_BASE_URL
        value: https://reciapp-4ih5.onrender.com
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
