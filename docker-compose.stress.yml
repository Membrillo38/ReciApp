# Isolated stress stack. Never attach to Traefik/public host.
# Bind localhost only; load via SSH tunnel from Mac.
#
# Usage on VPS:
#   docker compose -f docker-compose.stress.yml up -d --build
#   ssh -L 18000:127.0.0.1:18000 ubuntu@51.255.43.100
#   ./stress-test.sh

services:
  reciapp-stress-postgres:
    image: postgres:16-alpine
    container_name: reciapp-stress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reciapp_stress
      POSTGRES_PASSWORD: reciapp_stress_local_only
      POSTGRES_DB: reciapp_stress
    volumes:
      - reciapp_stress_pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./stress/pg-init.sh:/docker-entrypoint-initdb.d/01-migrations.sh:ro
    networks:
      - reciapp-stress
    ports:
      - "127.0.0.1:15432:5432"
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reciapp_stress -d reciapp_stress"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  reciapp-stress-api:
    build:
      context: .
      dockerfile: Dockerfile.stress
    image: reciapp-stress-api:local
    container_name: reciapp-stress-api
    restart: unless-stopped
    depends_on:
      reciapp-stress-postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: stress
      STRESS_TEST_MODE: "true"
      STRESS_RUN_ID: ${STRESS_RUN_ID:-local-dev}
      STRESS_TOKEN: ${STRESS_TOKEN:-stress-dev-token-change-me}
      STRESS_ALLOWED_HOSTS: stress-test.local
      STRESS_MOCK_LATENCY_MS: ${STRESS_MOCK_LATENCY_MS:-50}
      STRESS_MOCK_FAIL_PCT: ${STRESS_MOCK_FAIL_PCT:-0}
      OPENAI_API_KEY: ""
      API_KEY: ${STRESS_API_KEY:-stress-admin-key}
      AUTH_JWT_SECRET: ${STRESS_JWT_SECRET:-stress-jwt-secret-not-for-prod-use-32b}
      AUTH_JWT_ISSUER: reciapp-api
      AUTH_JWT_AUDIENCE: reciapp-ios
      DATABASE_URL: postgresql://reciapp_stress:reciapp_stress_local_only@reciapp-stress-postgres:5432/reciapp_stress
      PUBLIC_API_BASE_URL: http://127.0.0.1:18000
      CORS_ORIGINS: http://127.0.0.1:18000
      BILLING_GUARD_ENABLED: "false"
      EXTRACT_DRY_RUN: "false"
      WORKER_ENABLED: "false"
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-8}
      RATE_LIMIT_PER_IP_PER_MINUTE: "100000"
      RATE_LIMIT_PER_USER_PER_MINUTE: "100000"
      RATE_LIMIT_EXTRACT_PER_IP_PER_MINUTE: "100000"
      RATE_LIMIT_EXTRACT_PER_USER_PER_MINUTE: "100000"
      RATE_LIMIT_EXTRACT_DAILY_PER_USER: "1000000"
      DASHBOARD_PASSWORD: ""
      DASHBOARD_SESSION_SECRET: stress-dashboard-unused
      DASHBOARD_COOKIE_SECURE: "false"
      TRUSTED_PROXY_IPS: "127.0.0.1"
      PORT: "8000"
    networks:
      - reciapp-stress
    ports:
      - "127.0.0.1:18000:8000"
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  reciapp-stress:
    name: reciapp-stress
    driver: bridge
    internal: false

volumes:
  reciapp_stress_pgdata:
    name: reciapp_stress_pgdata
