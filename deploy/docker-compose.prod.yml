# Recipe Backend production stack (VPS).
# Postgres lives in separate reciapp-postgres on network reciapp-internal.
# Traefik (coolify-proxy) terminates HTTPS on the coolify network.

services:
  recipe-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: reciapp-backend:local
    container_name: recipe-backend
    restart: unless-stopped
    env_file:
      - /etc/reciapp/recipe-backend.env
    networks:
      - reciapp-internal
      - coolify
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/tmp:size=512m,mode=1777
    volumes:
      - /var/lib/reciapp/covers:/var/lib/reciapp/covers:rw
    environment:
      COVER_STORAGE_DIR: /var/lib/reciapp/covers
      HF_HOME: /tmp/hf
      HUGGINGFACE_HUB_CACHE: /tmp/hf
    mem_limit: 3g
    cpus: 2.5
    pids_limit: 512
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.recipe-backend.rule=Host(`51-255-43-100.sslip.io`)
      - traefik.http.routers.recipe-backend.entrypoints=https
      - traefik.http.routers.recipe-backend.tls=true
      - traefik.http.routers.recipe-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.recipe-backend-http.rule=Host(`51-255-43-100.sslip.io`)
      - traefik.http.routers.recipe-backend-http.entrypoints=http
      - traefik.http.routers.recipe-backend-http.middlewares=recipe-backend-https-redirect
      - traefik.http.middlewares.recipe-backend-https-redirect.redirectscheme.scheme=https
      - traefik.http.services.recipe-backend.loadbalancer.server.port=8000
      - coolify.managed=false

networks:
  reciapp-internal:
    external: true
  coolify:
    external: true
