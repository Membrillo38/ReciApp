{% extends "dashboard/base.html" %}
{% block title %}Login · ReciApp Admin{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>Admin login</h1>
  <p class="muted">Solo tú. Password + TOTP MFA. Cookie httpOnly Secure SameSite=Strict.</p>
  <form method="post" action="/dashboard/login" style="margin-top:1rem; display:grid; gap:0.75rem;">
    <input type="password" name="password" placeholder="Dashboard password" autocomplete="current-password" required autofocus />
    <input inputmode="numeric" pattern="[0-9]{6}" name="totp" placeholder="Código TOTP de 6 dígitos" autocomplete="one-time-code" required />
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
