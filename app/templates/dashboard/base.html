<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>{% block title %}ReciApp Admin{% endblock %}</title>
  <style>
    :root {
      /* Match Homepage dark slate cpanel */
      --canvas: #0b1220;
      --surface: #151d2e;
      --surface-2: #1b2538;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.12);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #34d399;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --orange: #fb923c;
      --orange-soft: rgba(251, 146, 60, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #7dd3fc; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      padding: 0.95rem 1.35rem;
      background: rgba(21, 29, 46, 0.92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header strong {
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      padding: 0.45rem 0.7rem;
      color: var(--muted);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }
    nav a.active, nav a:hover {
      color: var(--ink);
      background: var(--surface-2);
    }
    main { padding: 1.5rem 1.35rem 3rem; max-width: 1240px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: none;
      border-radius: 16px;
      padding: 1.15rem 1.2rem;
      overflow-x: auto;
    }
    .card .label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card .value {
      color: var(--ink);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-top: 0.4rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    th, td {
      text-align: left;
      padding: 0.8rem 0.55rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 650; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .ok { color: var(--green); }
    .bad { color: var(--danger); }
    .muted { color: var(--muted); }
    .ip-link {
      color: var(--ink);
      font-weight: 650;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
    }
    .ip-link:hover { color: var(--accent); }
    .chip {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
    }
    .chip.bad { background: var(--danger-soft); color: var(--danger); }
    .chip.ok { background: rgba(52, 211, 153, 0.14); color: var(--green); }
    input, button, select {
      font: inherit;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      border: none;
      background: var(--surface-2);
      color: var(--ink);
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button, .btn {
      background: var(--accent);
      border: none;
      color: #0b1220;
      font-weight: 700;
      cursor: pointer;
    }
    button.danger { background: var(--danger); color: #0b1220; }
    button.ghost, .btn.ghost {
      background: var(--surface-2);
      color: var(--ink);
    }
    .login-wrap {
      max-width: 360px;
      margin: 12vh auto;
      padding: 1.5rem;
    }
    .row { display: flex; gap: 0.625rem; flex-wrap: wrap; align-items: center; }
    .flash {
      background: var(--accent-soft);
      color: var(--ink);
      padding: 0.8rem 1rem;
      border-radius: 14px;
      margin-bottom: 1rem;
    }
    .flash.err { background: var(--danger-soft); color: var(--danger); }
    h1 {
      color: var(--ink);
      font-size: clamp(1.55rem, 3vw, 1.85rem);
      letter-spacing: -0.03em;
      margin: 0 0 0.4rem;
      font-weight: 700;
    }
    h2 {
      color: var(--ink);
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      margin: 1.6rem 0 0.75rem;
      font-weight: 700;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .back:hover { color: var(--ink); }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
    }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; gap: 0.5rem; }
      nav { width: 100%; }
      main { padding-inline: 1rem; }
      .card { border-radius: 14px; padding: 1rem; }
    }
  </style>
</head>
<body>
  {% if show_nav %}
  <header>
    <strong>ReciApp Admin</strong>
    <nav>
      <a href="/dashboard" class="{% if tab=='overview' %}active{% endif %}">Overview</a>
      <a href="/dashboard/users" class="{% if tab=='users' %}active{% endif %}">Users</a>
      <a href="/dashboard/recipes" class="{% if tab=='recipes' %}active{% endif %}">Recipes</a>
      <a href="/dashboard/jobs" class="{% if tab=='jobs' %}active{% endif %}">Jobs</a>
      <a href="/dashboard/usage" class="{% if tab=='usage' %}active{% endif %}">Usage</a>
      <a href="/dashboard/requests" class="{% if tab=='requests' %}active{% endif %}">Requests</a>
      <a href="/dashboard/threats" class="{% if tab=='threats' %}active{% endif %}">Amenazas</a>
      <a href="/dashboard/ips" class="{% if tab=='ips' %}active{% endif %}">IPs</a>
      <a href="/dashboard/logout">Salir</a>
    </nav>
  </header>
  {% endif %}
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
