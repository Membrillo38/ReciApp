<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="light" />
  <title>{% block title %}ReciApp Admin{% endblock %}</title>
  <style>
    :root {
      /* ReciTheme tokens: kept in sync with IosAPP/ReciApp/ReciAppApp.swift. */
      --canvas: #f7f7fa;
      --surface: #ffffff;
      --ink: #202126;
      --muted: #74757d;
      --line: #e9e9ef;
      --orange: #ff6240;
      --orange-soft: #ffe9e2;
      --green: #4f7e6b;
      --danger: #b54745;
      --danger-soft: #fdebea;
      --shadow-soft: 0 8px 20px rgba(32, 33, 38, 0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.4;
    }
    a { color: var(--orange); text-decoration: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header strong {
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      padding: 0.5rem 0.7rem;
      color: var(--muted);
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    nav a.active, nav a:hover {
      color: var(--orange);
      background: var(--orange-soft);
    }
    main { padding: 1.5rem 1.25rem 3rem; max-width: 1240px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.875rem;
      margin-bottom: 1.75rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 1.25rem;
      box-shadow: var(--shadow-soft);
      overflow-x: auto;
    }
    .card .label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .card .value {
      color: var(--ink);
      font-size: 1.65rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-top: 0.35rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 650; }
    tbody tr:last-child td { border-bottom: 0; }
    .ok { color: var(--green); }
    .bad { color: var(--danger); }
    .muted { color: var(--muted); }
    input, button, select {
      font: inherit;
      padding: 0.7rem 0.85rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--orange-soft);
      outline-offset: 2px;
    }
    button, .btn {
      background: var(--orange);
      border: none;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }
    button.danger { background: var(--danger); color: #fff; }
    button.ghost { background: var(--orange-soft); border-color: transparent; color: var(--orange); }
    .login-wrap {
      max-width: 360px;
      margin: 12vh auto;
      padding: 1.5rem;
    }
    .row { display: flex; gap: 0.625rem; flex-wrap: wrap; align-items: center; }
    .flash {
      background: var(--orange-soft);
      color: var(--ink);
      padding: 0.8rem 1rem;
      border-radius: 18px;
      margin-bottom: 1rem;
    }
    .flash.err { background: var(--danger-soft); color: var(--danger); }
    h1 {
      color: var(--ink);
      font-size: clamp(1.75rem, 3vw, 2rem);
      letter-spacing: -0.03em;
      margin: 0 0 1.25rem;
    }
    h2 {
      color: var(--ink);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      margin: 1.75rem 0 0.85rem;
      font-weight: 750;
    }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; gap: 0.5rem; }
      nav { width: 100%; }
      main { padding-inline: 1rem; }
      .card { border-radius: 22px; padding: 1rem; }
    }
  </style>
</head>
<body>
  {% if show_nav %}
  <header>
    <strong>ReciApp Admin</strong>
    <nav>
      <a href="/dashboard" class="{% if tab=='overview' %}active{% endif %}">Overview</a>
      <a href="/dashboard/users" class="{% if tab=='users' %}active{% endif %}">Users</a>
      <a href="/dashboard/recipes" class="{% if tab=='recipes' %}active{% endif %}">Recipes</a>
      <a href="/dashboard/jobs" class="{% if tab=='jobs' %}active{% endif %}">Jobs</a>
      <a href="/dashboard/usage" class="{% if tab=='usage' %}active{% endif %}">Usage</a>
      <a href="/dashboard/requests" class="{% if tab=='requests' %}active{% endif %}">Requests</a>
      <a href="/dashboard/logout">Logout</a>
    </nav>
  </header>
  {% endif %}
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
